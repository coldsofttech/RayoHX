[defaults]
profiles = ["python", "node"]
risk = "safe"

[clean]
# Hypothesis (python.hypothesis) keeps a local example database and Schemathesis (python.schemathesis)
# keeps failing cases for replay. Both are opt-in because they hold regression seeds, which this
# template does not rely on; both are rebuilt on the next test run.
enable = ["python.hypothesis", "python.schemathesis"]
# Exclusions always win over cleanup rules. Keep the uv environment and installed UI dependencies
# between commits.
exclude = [".venv/", "node_modules/"]

[hook]
quiet = true
