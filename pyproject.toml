# Workspace root: not published itself. The distributions live in packages/ (core -> rayohx,
# cli -> rayohx-cli, api -> rayohx-api, ui -> rayohx-ui).
[tool.uv.workspace]
members = ["packages/core", "packages/cli", "packages/api", "packages/ui"]

[tool.uv.sources]
rayohx = { workspace = true }
rayohx-cli = { workspace = true }
rayohx-api = { workspace = true }
rayohx-ui = { workspace = true }

[dependency-groups]
dev = [
  "rayohx",
  "rayohx-cli",
  "rayohx-api",
  "rayohx-ui",
  "cornea-shell[proxy]>=0.1.1",
  "httpx2>=2.16.2",
  "mypy>=1.13",
  "pip-licenses>=5",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.6",
  "ruff>=0.8",
  "schemathesis>=4.33.2",
]
installer = [
    "hatchling>=1.33.0",
    "pyinstaller>=6.22.3",
]

[tool.ruff]
line-length = 100
src = [
  "packages/core/src",
  "packages/cli/src",
  "packages/api/src",
  "packages/ui/src",
  "packages/core/tests",
  "packages/api/tests",
  "packages/ui/tests",
]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PT", "RUF", "S", "SIM", "T20", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["S101", "S105", "S106", "S603"]  # assert, subprocess and fake passwords are fine in tests
"packages/core/tests/integration/**" = ["SIM117"]  # the client is built from the running server's address
"scripts/**" = ["S603", "S607", "T201"]  # scripts call the trusted gh CLI and print progress

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "packages/core/src:packages/cli/src:packages/api/src:packages/ui/src:scripts"
files = ["packages"]

[tool.pytest.ini_options]
addopts = "-m 'not integration' --strict-markers --cov=rayohx --cov=rayohx_cli --cov=rayohx_api --cov=rayohx_ui --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: slower end-to-end tests, run in CI but not by default or in pre-commit"]

[tool.coverage.run]
branch = true
