# Workspace root: not published itself. The distributions live in packages/ (core -> rayohx,
# pytest -> rayohx-pytest, the shared test plugin).
[tool.uv.workspace]
members = ["packages/core", "packages/pytest"]

[tool.uv.sources]
rayohx = { workspace = true }
rayohx-pytest = { workspace = true }

[dependency-groups]
dev = [
  "rayohx",
  "rayohx-pytest",
  "mypy>=1.13",
  "pip-licenses>=5",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.6",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
src = [
  "packages/core/src",
  "packages/pytest/src",
  "packages/core/tests",
]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PT", "RUF", "S", "SIM", "T20", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["S101", "S105", "S106", "S603"]  # assert, subprocess and fake passwords are fine in tests
"packages/core/tests/integration/**" = ["SIM117"]  # the client is built from the running server's address
[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "packages/core/src:packages/pytest/src"
files = ["packages"]

[tool.pyright]
extraPaths = [
  "packages/core/src",
  "packages/pytest/src",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration' --strict-markers --cov=rayohx --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: slower end-to-end tests, run in CI but not by default or in pre-commit"]

[tool.coverage.run]
branch = true
