name: Read project names
description: Export the project names and paths (UI_DIR, CLI_NAME, CORE_PACKAGE, ...) to the job environment, read from packages/cli and packages/ui.

runs:
  using: composite
  steps:
    - name: Read project names
      shell: bash
      run: |
        python3 packages/cli/installer/projectinfo.py github || python packages/cli/installer/projectinfo.py github
        python3 packages/ui/installer/projectinfo.py github || python packages/ui/installer/projectinfo.py github
