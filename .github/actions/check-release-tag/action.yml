name: Check the release tag
description: Fail unless the release tag is the prefix plus the package's version. Run after checkout.

inputs:
  package:
    description: Distribution name of the package, for example rayohx-cli.
    required: true
  prefix:
    description: Tag prefix before the version, for example cli-v.
    required: true

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: ./.github/actions/setup-uv
      with:
        sync: "false"
    - name: Check the tag matches the package version
      shell: bash
      env:
        TAG: ${{ github.event.release.tag_name }}
        PACKAGE: ${{ inputs.package }}
        PREFIX: ${{ inputs.prefix }}
      run: |
        version="$(uv version --package "$PACKAGE" --short)"
        [ "$TAG" = "${PREFIX}${version}" ] || { echo "Tag $TAG does not match $PACKAGE ${PREFIX}${version}"; exit 1; }
