name: Release

# Runs when a GitHub release is published with a tag vX.Y.Z. It builds the rayohx library as compiled
# wheels (one Nuitka .pyd on Windows, .so elsewhere) with cibuildwheel, one per OS, architecture and
# Python version, with no sdist and so no .py sources. Once the `core` environment is approved
# (Settings > Environments), it publishes them to PyPI with trusted publishing (no stored tokens) and
# attaches them to the release. The pytest plugin is not released: it is installed from git.
#
# The tag must match the version in packages/core/pyproject.toml (read from __version__ in
# packages/core/src/rayohx/__init__.py). The RayoHX-CLI, RayoHX-Docker and RayoHX-Desktop
# repositories release on their own, and rayohx-cli depends on the rayohx package on PyPI, so release
# core first.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  core-check:
    name: core check tag
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Check the tag
        uses: ./.github/actions/check-release-tag
        with:
          package: rayohx
          prefix: v

  # One job per OS and Python version, so the wheels build in parallel.
  core-build:
    name: core build (${{ matrix.os }}, cp${{ matrix.python }})
    needs: core-check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
        python: ["311", "312", "313", "314", "315"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Build the compiled wheel
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: cp${{ matrix.python }}-*
        with:
          package-dir: packages/core
          output-dir: dist
      - name: Upload the distribution files
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}-cp${{ matrix.python }}
          path: dist/*.whl

  core-publish:
    name: core publish (PyPI)
    needs: core-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: core
    permissions:
      contents: write # attach files to the release
      id-token: write # PyPI trusted publishing
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Download the distribution files
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach the files to the release
        uses: ./.github/actions/attach-release-files
