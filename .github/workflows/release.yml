name: Release

# Runs when a GitHub release is published. The tag decides what is released, and each part waits for
# the approval of its own environment (Settings > Environments) before it publishes anything:
#
#   vX.Y.Z          core    the rayohx package to PyPI                       environment: core
#   cli-vX.Y.Z      cli     the rayohx-cli package to PyPI, and the setup.exe, deb and rpm
#                           installers on the GitHub release                  environment: cli
#   ui-vX.Y.Z       ui      the Windows installer (window, API and core)
#                           on the GitHub release                            environment: ui
#   docker-vX.Y.Z   docker  the image to GHCR                                environment: docker
#
# The tag must match the version in the package's pyproject.toml. Release core before cli, because
# rayohx-cli depends on the rayohx package on PyPI. SIGN_COMMAND (repository variable) optionally
# signs the installers; {file} marks where the path of one file goes. Homebrew, Scoop and winget
# are not updated for now.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  core:
    if: startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/release-core.yml
    permissions:
      contents: write
      id-token: write

  cli:
    if: startsWith(github.event.release.tag_name, 'cli-v')
    uses: ./.github/workflows/release-cli.yml
    permissions:
      contents: write
      id-token: write

  ui:
    if: startsWith(github.event.release.tag_name, 'ui-v')
    uses: ./.github/workflows/release-ui.yml
    permissions:
      contents: write

  docker:
    if: startsWith(github.event.release.tag_name, 'docker-v')
    uses: ./.github/workflows/release-docker.yml
    permissions:
      contents: read
      packages: write
