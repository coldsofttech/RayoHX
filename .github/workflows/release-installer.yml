name: Release installer

# Tag installer-vX.Y.Z: builds the full Windows setup (the command line and the desktop window, with the
# API and the core library) and the command line's portable zip. Nothing goes to PyPI. Attaching
# the files to the GitHub release waits for the approval of the `installer` environment. The tag must
# match the version in installer/build.toml. Called by release.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  installer-check:
    name: installer check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Check the tag matches the installer version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('installer/build.toml','rb'))['version'])")"
          [ "$TAG" = "installer-v${version}" ] || { echo "Tag $TAG does not match installer-v${version}"; exit 1; }

  installer-windows:
    name: installer (windows)
    needs: installer-check
    runs-on: windows-latest
    timeout-minutes: 30 # target: under 10 minutes
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Read project names
        uses: ./.github/actions/project-info
      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.15"
          sync-args: --locked --all-packages --group installer
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.UI_DIR }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ env.UI_DIR }}/package-lock.json
      - name: Install installer tools
        uses: ./.github/actions/install-installer-tools
      - name: Build, sign (if SIGN_COMMAND is set) and smoke test the installer
        env:
          SIGN_COMMAND: ${{ vars.SIGN_COMMAND }}
        run: uv run --no-sync python installer/scripts/build.py --build-frontend --smoke
      - name: Upload the Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: installers-windows
          path: |
            dist/installer/*.exe
            dist/installer/*.json
            dist/installer/*.zip

  installer-publish:
    name: installer publish (GitHub release)
    needs: installer-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: installer
    permissions:
      contents: write # attach files to the release
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Attach the installer to the release
        uses: ./.github/actions/attach-release-files
