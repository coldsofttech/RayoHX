name: CI Docker

# packages/docker: builds the command line image (packages/docker/Dockerfile) for linux/amd64 and
# checks it runs as an unprivileged user. Nothing is published; release-docker.yml pushes the image
# to GHCR for a docker-vX.Y.Z release. See packages/docker/docs/docker.md. Called by ci.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  docker-smoke:
    name: docker build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/docker/Dockerfile
          load: true
          tags: rayohx:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v6
      - name: Test the image
        run: uv run --with pytest pytest -c packages/docker/pytest.ini packages/docker/tests
        env:
          RAYOHX_IMAGE: rayohx:test
      - name: Image size
        run: docker image ls rayohx:test --format '{{.Size}}'
