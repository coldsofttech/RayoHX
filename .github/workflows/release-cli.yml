name: Release CLI

# Tag cli-vX.Y.Z: builds the command line (rayohx-cli) as compiled wheels (one Nuitka .pyd on
# Windows, .so elsewhere) with cibuildwheel, one per OS, architecture and Python version, with no
# sdist; the installers are built by release-installer.yml. Publishing the package to PyPI and attaching the files to the GitHub
# release happen in release.yml, because PyPI does not support trusted publishing from a reusable
# workflow. Release core first: rayohx-cli depends on the rayohx package on PyPI. Called by
# release.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  cli-check:
    name: cli check tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Check the tag
        uses: ./.github/actions/check-release-tag
        with:
          package: rayohx-cli
          prefix: cli-v

  cli-build:
    name: cli build (${{ matrix.os }})
    needs: cli-check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Build the compiled wheels
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: packages/cli
          output-dir: dist
      - name: Upload the distribution files
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.whl
