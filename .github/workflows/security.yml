name: Security

# Static analysis (Semgrep). Findings are uploaded as SARIF, so they show up in the
# repository's Security tab (Code scanning) next to CodeQL, and the jobs fail when they find a problem.
# These jobs are not part of the required `ci` check, so a new rule does not block unrelated pull
# requests. The weekly run catches vulnerabilities published after a merge.
# Calls one workflow per package (security-core, security-cli, security-api, security-ui,
# security-docker) and one for the rest of the repository (security-repo).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    uses: ./.github/workflows/security-core.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  cli:
    uses: ./.github/workflows/security-cli.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  api:
    uses: ./.github/workflows/security-api.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  ui:
    uses: ./.github/workflows/security-ui.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  docker:
    uses: ./.github/workflows/security-docker.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  repo:
    uses: ./.github/workflows/security-repo.yml
    permissions:
      contents: read
      security-events: write
      actions: read
