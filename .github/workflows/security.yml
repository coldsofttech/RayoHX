name: Security

# Static analysis (Semgrep). Findings are uploaded as SARIF, so they show up in the
# repository's Security tab (Code scanning) next to CodeQL, and the jobs fail when they find a problem.
# These jobs are not part of the required `ci` check, so a new rule does not block unrelated pull
# requests. The weekly run catches vulnerabilities published after a merge.
# Scans core, the pytest plugin and the rest of the repository (scripts and workflows).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-semgrep:
    name: core semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Semgrep
        uses: ./.github/actions/semgrep
        with:
          path: packages/core
          configs: p/python p/owasp-top-ten
          category: semgrep-core

  pytest-semgrep:
    name: pytest semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Semgrep
        uses: ./.github/actions/semgrep
        with:
          path: packages/pytest
          configs: p/python p/owasp-top-ten
          category: semgrep-pytest

  repo-semgrep:
    name: repo semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Semgrep
        uses: ./.github/actions/semgrep
        with:
          configs: p/python p/owasp-top-ten p/github-actions
          exclude: packages
          category: semgrep-repo
