name: CI

# Calls one workflow per package (ci-core, ci-cli, ci-api, ci-ui, ci-docker) and one for the rest
# of the repository (ci-repo); `ci` at the end is the single required check for the branch ruleset.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    uses: ./.github/workflows/ci-core.yml

  cli:
    uses: ./.github/workflows/ci-cli.yml

  api:
    uses: ./.github/workflows/ci-api.yml

  ui:
    uses: ./.github/workflows/ci-ui.yml

  docker:
    uses: ./.github/workflows/ci-docker.yml

  repo:
    uses: ./.github/workflows/ci-repo.yml

  ci:
    name: CI result
    if: always()
    needs: [core, cli, api, ui, docker, repo]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
