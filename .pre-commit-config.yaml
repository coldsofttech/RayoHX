exclude: ^packages/pytest/src/rayohx_pytest/data/media/.*$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.(ps1|bat)$
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/coldsofttech/Sweepito
    rev: v0.1.0
    hooks:
      - id: sweepito-scan
      - id: sweepito-clean
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        alias: ruff-check-core
        name: ruff check (core)
        args: [--fix]
        files: ^packages/core/
      - id: ruff-format
        alias: ruff-format-core
        name: ruff format (core)
        files: ^packages/core/
      - id: ruff-check
        alias: ruff-check-pytest
        name: ruff check (pytest)
        args: [--fix]
        files: ^packages/pytest/
      - id: ruff-format
        alias: ruff-format-pytest
        name: ruff format (pytest)
        files: ^packages/pytest/
      - id: ruff-check
        alias: ruff-check-repo
        name: ruff check (repo)
        args: [--fix]
        files: ^(?!packages/)
      - id: ruff-format
        alias: ruff-format-repo
        name: ruff format (repo)
        files: ^(?!packages/)
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: mypy-core
        name: mypy (core)
        entry: uv run mypy packages/core/src
        language: system
        files: ^packages/core/.*\.py$
        pass_filenames: false
      - id: mypy-pytest
        name: mypy (pytest)
        entry: uv run mypy packages/pytest/src
        language: system
        files: ^packages/pytest/.*\.py$
        pass_filenames: false
      - id: pytest-core
        name: pytest (core)
        entry: uv run pytest -c packages/core/pyproject.toml packages/core/tests -n auto
        language: system
        files: ^packages/core/.*\.py$
        pass_filenames: false
