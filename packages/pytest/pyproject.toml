[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "rayohx-pytest"
dynamic = ["version"]
description = "Shared pytest plugin for the RayoHX repositories: local HTTP servers, HLS streams and fixtures."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "coldsofttech" }]
classifiers = [
  "Framework :: Pytest",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=43",
  "httpx>=0.28.1",
  "pytest>=8.3",
]

# Test support for the RayoHX repositories. Not published to PyPI: the other repositories take it
# from git as a development dependency.
[project.entry-points.pytest11]
rayohx_pytest = "rayohx_pytest.plugin"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "ruff>=0.17.4",
]

[tool.hatch.version]
path = "src/rayohx_pytest/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rayohx_pytest"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PT", "RUF", "S", "SIM", "T20", "UP", "W"]

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "src"
files = ["src"]
