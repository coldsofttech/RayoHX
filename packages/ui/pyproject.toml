[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rayohx-ui"
version = "0.1.0"
description = "RayoHX native window, with the HTTP API built in."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "coldsofttech" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "rayohx",
  "cornea-shell>=0.1.1 ; sys_platform == 'win32'",
  "rayohx-api",
]

[project.gui-scripts]
rayohxu = "rayohx_ui.__main__:main"

[project.urls]
Homepage = "https://github.com/coldsofttech/RayoHX"
Issues = "https://github.com/coldsofttech/RayoHX/issues"
Changelog = "https://github.com/coldsofttech/RayoHX/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/rayohx_ui"]

[dependency-groups]
dev = [
  "cornea-shell>=0.1.1",
  "httpx2>=2.16.2",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.6",
  "ruff>=0.17.4",
]
installer = [
  "hatchling>=1.33.0",
  "pyinstaller>=6.22.3",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "../core/src", "../api/src"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PT", "RUF", "S", "SIM", "T20", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]  # assert, subprocess and fake passwords are fine in tests

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers --cov=rayohx_ui --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: slower end-to-end tests, run in CI but not by default or in pre-commit"]

[tool.coverage.run]
branch = true
